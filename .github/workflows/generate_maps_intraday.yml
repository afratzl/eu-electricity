name: Generate Intraday Maps
# Split out from update_intraday.yml so map generation runs as its own
# job, only after the main intraday analysis + summary table have
# already committed successfully. Keeps each job's own runtime
# comfortably under the 6-hour Actions limit, and means a slow/failed
# map run can't hold up (or get bundled into failure with) the more
# time-sensitive hourly data update.

on:
  workflow_run:
    workflows: ["Update Intraday Data"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-maps:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tzdata
          pip install entsoe-py pandas==2.2.3 matplotlib numpy gspread google-auth google-api-python-client pytz scipy geopandas shapely pyproj cairosvg Pillow

      - name: Create plots directory
        run: mkdir -p plots

      - name: Generate Yesterday and Last Week Maps
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "Generating yesterday map..."
          python scripts/generate_maps.py --period yesterday || echo "Failed to generate yesterday maps"
          echo "Generating last week map..."
          python scripts/generate_maps.py --period last_week || echo "Failed to generate last week maps"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin main

          # This job owns the Yesterday/LastWeek map keys only -- everything
          # else (Intraday, Yesterday country data, Monthly/Trends, Annual,
          # data_sheet_id) should come from whatever's freshest on
          # origin/main, not this job's own stale checkout.
          python scripts/merge_drive_links_for_commit.py \
            --owned-maps-keys Yesterday,LastWeek

          mkdir -p /tmp/plots_backup
          cp plots/map_*.png plots/drive_links.json /tmp/plots_backup/ 2>/dev/null || true

          git reset --hard origin/main

          cp /tmp/plots_backup/* plots/ 2>/dev/null || true

          git add -f plots/*.json

          if ! git diff --staged --quiet; then
            git commit -m "Update yesterday/last-week maps [hourly]"

            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Pushed successfully."
                break
              fi

              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to push after 3 attempts -- giving up, changes were not published."
                exit 1
              fi

              echo "Push failed (attempt $attempt/3) -- likely a concurrent commit. Re-fetching and re-merging..."
              git fetch origin main
              git reset --soft origin/main
              python scripts/merge_drive_links_for_commit.py \
                --owned-maps-keys Yesterday,LastWeek
              git add -f plots/*.json
              git commit -m "Update yesterday/last-week maps [hourly]"
            done
          else
            echo "No changes to commit"
          fi
