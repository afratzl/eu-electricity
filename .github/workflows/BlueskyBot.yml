name: Post to Bluesky

on:
  # Triggered by an external cron service (e.g. cron-job.org) calling
  # POST /repos/{owner}/{repo}/dispatches with event_type: bluesky-trigger,
  # instead of GitHub's own native 'schedule' trigger -- see
  # update_intraday.yml for the full explanation of why.
  repository_dispatch:
    types: [bluesky-trigger]
  workflow_dispatch:  # Allow manual triggering

jobs:
  post-to-bluesky:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      with:
        ref: main
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install atproto requests
    
    - name: Post to Bluesky
      env:
        BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
        BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
      run: |
        python scripts/bluesky_bot.py
