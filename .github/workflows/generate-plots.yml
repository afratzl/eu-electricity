name: Generate Historical Plots
on:
  workflow_run:
    workflows: ["Update Historical Data"]
    types:
      - completed
  workflow_dispatch:  # Manual trigger
    inputs:
      country:
        description: 'Country code (e.g. DE) or leave empty for all countries'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  generate-plots:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v5
      
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        pip install pandas==2.2.3 matplotlib numpy gspread google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
        
    - name: Generate historical plots
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        if [ -n "${{ github.event.inputs.country }}" ]; then
          python scripts/eu_energy_plotting.py --country ${{ github.event.inputs.country }}
        else
          python scripts/eu_energy_plotting.py
        fi
    
    - name: Generate Summary Table JSON
      env:
        GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
      run: |
        echo "Generating summary table JSON..."
        python scripts/generate_summary_table_json.py || echo "Failed to generate JSON"
        
    - name: Commit and push plots
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"

        git fetch origin main

        # This job (via eu_energy_plotting.py) legitimately computes
        # per-country 'Monthly' and 'Trends' -- everything else (Intraday,
        # Yesterday, Maps, data_sheet_id) should come from whatever's
        # freshest on origin/main, not this job's own stale checkout.
        # Replaces the previous 'git pull --rebase origin main || true' +
        # 'git push || true', which silently swallowed any conflict/failure
        # instead of resolving it.
        python scripts/merge_drive_links_for_commit.py \
          --owned-country-keys Monthly,Trends

        git add -f plots/*.html plots/*.json

        if ! git diff --staged --quiet; then
          git commit -m "Generate historical plots and summary JSON [skip ci]"

          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed successfully."
              break
            fi

            if [ "$attempt" = "3" ]; then
              echo "::error::Failed to push after 3 attempts -- giving up, changes were not published."
              exit 1
            fi

            echo "Push failed (attempt $attempt/3) -- likely a concurrent commit. Re-fetching and re-merging..."
            git fetch origin main
            git reset --soft origin/main
            python scripts/merge_drive_links_for_commit.py \
              --owned-country-keys Monthly,Trends
            git add -f plots/*.html plots/*.json
            git commit -m "Generate historical plots and summary JSON [skip ci]"
          done
        else
          echo "No changes to commit"
        fi
