name: Update Historical Data
on:
  schedule:
    # Daily updates for historical data (at 0:00 AM UTC)
    - cron: '0 18 * * *'
  
  workflow_dispatch:
    inputs:
      years_start:
        description: 'Start year (default: current year)'
        required: false
        default: ''
      years_end:
        description: 'End year (default: current year)'
        required: false
        default: ''
      country:
        description: 'Country code to process (default: all). E.g. DE, FR, EU, RS, BA, ME, MK, XK, GE'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-historical:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install entsoe-py pandas==2.2.3 matplotlib numpy gspread google-auth pytz scipy google-api-python-client geopandas shapely pyproj cairosvg Pillow
      
      - name: Create plots directory
        run: mkdir -p plots
      
      - name: Run Historical Data Collection
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          NED_API_KEY: ${{ secrets.NED_API_KEY }}
        run: |
          YEAR_START="${{ github.event.inputs.years_start }}"
          YEAR_END="${{ github.event.inputs.years_end }}"
          COUNTRY="${{ github.event.inputs.country }}"
          
          CURRENT_YEAR=$(date +%Y)
          YEAR_START=${YEAR_START:-$CURRENT_YEAR}
          YEAR_END=${YEAR_END:-$CURRENT_YEAR}
          
          CMD="python scripts/eu_energy_data_collection.py --years $YEAR_START $YEAR_END"
          if [ -n "$COUNTRY" ]; then
            COUNTRY_CLEAN=$(echo "$COUNTRY" | tr ',' ' ' | tr -s ' ')
            CMD="$CMD --countries $COUNTRY_CLEAN"
          fi
          
          echo "Running: $CMD"
          eval $CMD
      # Plotting and summary-table JSON generation moved to their own
      # workflow (generate_historical_plots.yml), triggered after this one
      # completes. This step only writes to Google Sheets, not local repo
      # files, so no commit step is needed here at all -- keeps this job's
      # own runtime comfortably under the 6-hour Actions limit, separate
      # from the plotting/JSON step's own runtime.
