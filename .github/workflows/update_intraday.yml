name: Update Intraday Data
on:
  schedule:
    # Hourly updates for intraday analysis (at minute 5)
    - cron: '20 1,3,5,7,9,12,15,18 * * *'
  
  workflow_dispatch:  # Allow manual triggers
permissions:
  contents: write
jobs:
  update-intraday:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
         python -m pip install --upgrade pip
         pip install tzdata
         pip install entsoe-py pandas==2.2.3 matplotlib numpy gspread google-auth google-api-python-client pytz scipy geopandas shapely pyproj cairosvg Pillow
         
      - name: Create plots directory
        run: mkdir -p plots
      
      - name: Run Intraday Analysis
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          NED_API_KEY: ${{ secrets.NED_API_KEY }}
        run: |
          echo "Running hourly intraday analysis..."
          python scripts/intraday_analysis.py || echo "Failed to generate intraday plots"
      
      - name: Generate Summary Table JSON
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "Fixing any JSON conflicts first..."
          python scripts/fix_json_conflicts.py || true
          echo "Generating summary table JSON..."
          python scripts/generate_summary_table_json.py || echo "Failed to generate JSON"
      
      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Fetch latest from remote (doesn't touch the working directory yet)
          git fetch origin main

          # Merge plots/drive_links.json with whatever's on origin/main BEFORE
          # doing anything else. This replaces a previous approach that backed
          # up this job's own files, hard-reset to origin/main, then blindly
          # pasted this job's stale copy back on top -- which silently
          # discarded any newer Monthly/Trends data another concurrent job
          # had already pushed, since it never actually merged anything.
          # See merge_drive_links_for_commit.py for the full explanation.
          # Maps (Yesterday/LastWeek) are no longer owned here -- map
          # generation moved to its own workflow (generate_maps_intraday.yml),
          # triggered after this one completes, so this job's run stays
          # comfortably under the 6-hour Actions limit on its own.
          python scripts/merge_drive_links_for_commit.py \
            --owned-country-keys Intraday,Yesterday

          # Save our generated files (now including the merged drive_links.json)
          mkdir -p /tmp/plots_backup
          cp plots/*_analysis.png plots/last_update.html plots/energy_summary_table.json plots/drive_links.json /tmp/plots_backup/ 2>/dev/null || true

          # Reset to remote (safe now -- drive_links.json has already been
          # merged above, so restoring it below won't lose anything new)
          git reset --hard origin/main

          # Restore our new files, including the already-merged drive_links.json
          cp /tmp/plots_backup/* plots/ 2>/dev/null || true

          # Add and commit
          git add -f plots/*.html plots/*.json

          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "Update intraday plots and summary JSON [hourly]"

            # Retry push a few times in case another job's commit landed on
            # origin/main while this one was running. A plain 'git pull
            # --rebase' here would risk the same conflict-marker corruption
            # seen before if drive_links.json changed on both sides, so each
            # retry re-runs the JSON-aware merge against the newest remote
            # content instead of a text-level rebase for that file.
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Pushed successfully."
                break
              fi

              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to push after 3 attempts -- giving up, changes were not published."
                exit 1
              fi

              echo "Push failed (attempt $attempt/3) -- likely a concurrent commit. Re-fetching and re-merging..."
              git fetch origin main
              # Move our branch onto the new remote tip, keeping our changes
              # staged so they can be re-merged against the fresher content.
              git reset --soft origin/main
              python scripts/merge_drive_links_for_commit.py \
                --owned-country-keys Intraday,Yesterday
              git add -f plots/*.html plots/*.json
              git commit -m "Update intraday plots and summary JSON [hourly]"
            done
          else
            echo "No changes to commit"
          fi
