name: Generate Monthly and Annual Maps

on:
  workflow_run:
    workflows: ["Update Historical Data"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-maps:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth pandas matplotlib numpy google-api-python-client geopandas shapely pyproj cairosvg Pillow

      - name: Create plots directory
        run: mkdir -p plots

      - name: Generate Annual Maps
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          CURRENT_YEAR=$(date +%Y)
          echo "Generating annual maps for 2015 to $CURRENT_YEAR..."
          python scripts/generate_maps.py --period annual || echo "Failed annual maps"

      - name: Generate All Monthly Maps
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          echo "Generating all 12 monthly maps in one run..."
          python scripts/generate_maps.py --all-months || echo "Failed monthly maps"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git fetch origin main

          # Merge drive_links.json against origin/main BEFORE any rebase.
          # This job legitimately computes Maps.Monthly and Maps.Annual --
          # everything else (per-country Intraday/Yesterday/Monthly/Trends,
          # Maps.Yesterday/LastWeek) should come from whatever's freshest on
          # origin/main, not this job's own stale checkout. Replaces a plain
          # 'git pull --rebase --autostash', which risked leaving raw
          # conflict markers in the file if drive_links.json changed on both
          # sides -- this is very likely what wiped Maps.Monthly/Annual down
          # to nothing previously. See merge_drive_links_for_commit.py.
          python scripts/merge_drive_links_for_commit.py \
            --owned-maps-keys Monthly,Annual

          git add -f plots/*.json

          if ! git diff --staged --quiet; then
            git commit -m "Update monthly and annual maps [auto]"

            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Pushed successfully."
                break
              fi

              if [ "$attempt" = "3" ]; then
                echo "::error::Failed to push after 3 attempts -- giving up, changes were not published."
                exit 1
              fi

              echo "Push failed (attempt $attempt/3) -- likely a concurrent commit. Re-fetching and re-merging..."
              git fetch origin main
              git reset --soft origin/main
              python scripts/merge_drive_links_for_commit.py \
                --owned-maps-keys Monthly,Annual
              git add -f plots/*.json
              git commit -m "Update monthly and annual maps [auto]"
            done
          else
            echo "No changes to commit"
          fi
